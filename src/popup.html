<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cocotivity eLead</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="mark" aria-hidden="true">C</div>
        <div>
          <p class="eyebrow">Cocotivity</p>
          <h1>eLead Extension</h1>
        </div>
      </header>

      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Report launcher</p>
        <h2 id="welcome-title">Dealership Sold Details</h2>
        <p class="intro">Choose dates here, then open the report and fill its criteria page.</p>

        <div class="date-fields">
          <label for="start-date">From
            <input id="start-date" name="startDate" type="text" inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" autocomplete="off" required>
          </label>
          <label for="end-date">To
            <input id="end-date" name="endDate" type="text" inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" autocomplete="off" required>
          </label>
        </div>

        <label class="criteria-field" for="vehicle-type">Vehicle Type
          <select id="vehicle-type">
            <option value="">All</option>
            <option value="N">New</option>
          </select>
        </label>

        <fieldset class="report-catalog">
          <legend>Reports to run</legend>
          <label><input type="checkbox" value="1847" data-report-name="Dealership Sold Details"> Dealership Sold Details</label>
          <label><input type="checkbox" value="1387" data-report-name="Source and Sub-Source Performance"> Source and Sub-Source Performance</label>
          <label><input type="checkbox" value="prospects-zip" data-report-name="Prospects by ZIP Code"> Prospects by ZIP Code</label>
        </fieldset>
        <button id="add-to-queue-button" class="secondary" type="button">Add selected to run queue</button>
        <button id="clear-queue-button" class="secondary" type="button">Clear queue</button>
        <section class="queue" aria-labelledby="queue-title">
          <h3 id="queue-title">Run queue</h3>
          <ol id="run-queue"><li class="empty-queue">No runs queued.</li></ol>
        </section>

        <button id="launch-report-button" type="button">Open report</button>
        <button id="run-report-button" class="secondary" type="button">Run selected report</button>
        <button id="run-next-button" class="secondary" type="button">Run next queued report</button>
        <button id="capture-table-button" class="secondary" type="button">Capture current table</button>
        <button id="copy-captures-button" class="secondary" type="button">Copy captures to clipboard</button>
        <button id="copy-diagnostic-button" class="secondary" type="button">Copy diagnostic</button>
        <button id="export-captures-button" class="secondary" type="button">Export captures for ETL</button>
        <p id="status" class="status" role="status" aria-live="polite">Ready when you are.</p>
      </section>

      <footer class="footer">
        <span>Version</span>
        <strong id="version">Loading…</strong>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
